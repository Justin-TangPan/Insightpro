<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="1000" viewBox="0 0 1600 1000" role="img" aria-labelledby="title desc">
  <title id="title">InsightPro 技术架构图</title>
  <desc id="desc">展示前端、FastAPI 后端、Insight-Agent、AI 模型、数据源和持久化层之间的关系。</desc>
  <defs>
    <linearGradient id="bg" x1="0" x2="1" y1="0" y2="1"><stop stop-color="#f8fafc"/><stop offset="1" stop-color="#eef2ff"/></linearGradient>
    <linearGradient id="agent" x1="0" x2="1"><stop stop-color="#4f46e5"/><stop offset="1" stop-color="#7c3aed"/></linearGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%"><feDropShadow dx="0" dy="8" stdDeviation="10" flood-color="#312e81" flood-opacity=".12"/></filter>
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="8" refY="5" orient="auto"><path d="M0 0 10 5 0 10Z" fill="#64748b"/></marker>
    <style>
      .title{font:700 30px Inter,Arial,sans-serif;fill:#0f172a}.subtitle{font:400 14px Inter,Arial,sans-serif;fill:#64748b}
      .section{font:700 13px Inter,Arial,sans-serif;fill:#475569;letter-spacing:1.5px}.box{fill:#fff;stroke:#cbd5e1;stroke-width:1.5;rx:16;filter:url(#shadow)}
      .box-title{font:700 17px Inter,Arial,sans-serif;fill:#0f172a}.body{font:400 13px Inter,Arial,sans-serif;fill:#475569}.small{font:400 12px Inter,Arial,sans-serif;fill:#64748b}
      .line{stroke:#64748b;stroke-width:2;fill:none;marker-end:url(#arrow)}.dashed{stroke-dasharray:7 7}.pill{fill:#eef2ff;stroke:#c7d2fe;rx:9}.pill-text{font:600 11px Inter,Arial,sans-serif;fill:#4338ca}
    </style>
  </defs>
  <rect width="1600" height="1000" fill="url(#bg)"/>
  <text x="80" y="72" class="title">InsightPro 技术架构</text>
  <text x="80" y="101" class="subtitle">统一模型配置 · Insight-Agent 推理 · 解决方案洞察与工作台交付</text>

  <text x="80" y="155" class="section">CLIENT / EXPERIENCE</text>
  <rect x="80" y="175" width="1440" height="145" class="box"/>
  <rect x="110" y="210" width="260" height="75" class="pill"/><text x="130" y="240" class="box-title">Next.js Web</text><text x="130" y="263" class="body">技术雷达 · 项目洞察 · 云方案</text>
  <rect x="400" y="210" width="260" height="75" class="pill"/><text x="420" y="240" class="box-title">管理工作台</text><text x="420" y="263" class="body">平台配置 · 数据看板 · 知识库</text>
  <rect x="690" y="210" width="260" height="75" class="pill"/><text x="710" y="240" class="box-title">方案实践</text><text x="710" y="263" class="body">需求 · 交付 · 评审 · 产物</text>
  <rect x="980" y="210" width="260" height="75" class="pill"/><text x="1000" y="240" class="box-title">Insight Agent</text><text x="1000" y="263" class="body">会话 · 上下文 · SSE 流式输出</text>
  <rect x="1270" y="210" width="210" height="75" class="pill"/><text x="1290" y="240" class="box-title">Auth / i18n</text><text x="1290" y="263" class="body">Supabase 登录 · 中英切换</text>

  <path d="M800 320V375" class="line"/>
  <text x="80" y="365" class="section">APPLICATION / API</text>
  <rect x="80" y="385" width="1440" height="205" class="box"/>
  <rect x="115" y="425" width="260" height="115" class="box"/><text x="135" y="456" class="box-title">FastAPI Backend</text><text x="135" y="482" class="body">REST / SSE API</text><text x="135" y="505" class="small">认证、任务、报表、邮件、爬虫</text><text x="135" y="525" class="small">健康检查与审计日志</text>
  <rect x="420" y="425" width="300" height="115" class="box"/><text x="440" y="456" class="box-title">Domain Services</text><text x="440" y="482" class="body">Hotspot · Evaluation · Knowledge</text><text x="440" y="505" class="small">项目价值评估（5 项切片）</text><text x="440" y="525" class="small">数据源同步与邮件调度</text>
  <rect x="765" y="425" width="330" height="115" rx="16" fill="url(#agent)" filter="url(#shadow)"/><text x="790" y="456" class="box-title" fill="#fff">Insight-Agent Runtime</text><text x="790" y="482" class="body" fill="#ede9fe">Context · Prompt · Skill</text><text x="790" y="505" class="small" fill="#ddd6fe">统一任务逻辑 / 流式模型调用</text><text x="790" y="525" class="small" fill="#ddd6fe">超时兜底与结构化输出</text>
  <rect x="1140" y="425" width="340" height="115" class="box"/><text x="1160" y="456" class="box-title">Runtime Configuration</text><text x="1160" y="482" class="body">.env → settings → Agent</text><text x="1160" y="505" class="small">API URL · API Key · Model ID</text><text x="1160" y="525" class="small">Model Alias · Connectivity test</text>
  <path d="M375 482H420M720 482H765M1095 482H1140" class="line"/>

  <path d="M800 590V645" class="line"/>
  <text x="80" y="635" class="section">AI / DATA PLANE</text>
  <rect x="80" y="655" width="1440" height="190" class="box"/>
  <rect x="115" y="700" width="315" height="105" class="box"/><text x="135" y="733" class="box-title">OpenAI-compatible AI API</text><text x="135" y="758" class="body">OpenPangu / ModelArts / 其他兼容服务</text><text x="135" y="781" class="small">CHAT_API_URL · CHAT_MODEL</text>
  <rect x="470" y="700" width="300" height="105" class="box"/><text x="490" y="733" class="box-title">External Sources</text><text x="490" y="758" class="body">GitHub Trending · README</text><text x="490" y="781" class="small">阿里云 / 华为云解决方案目录</text>
  <rect x="810" y="700" width="300" height="105" class="box"/><text x="830" y="733" class="box-title">Supabase Auth</text><text x="830" y="758" class="body">用户、角色、会话身份</text><text x="830" y="781" class="small">管理员权限与 Agent SSO</text>
  <rect x="1150" y="700" width="330" height="105" class="box"/><text x="1170" y="733" class="box-title">Hermes Runtime Manager</text><text x="1170" y="758" class="body">Agent workspace / tool execution</text><text x="1170" y="781" class="small">按需启停 · 工作区 · 产物回传</text>
  <path d="M930 590V675M930 675H272V700M930 675H620V700M930 675H960V700M930 675H1315V700" class="line dashed"/>

  <text x="80" y="895" class="section">PERSISTENCE / DELIVERY</text>
  <rect x="80" y="915" width="1440" height="45" class="box"/>
  <text x="115" y="943" class="body">PostgreSQL / Supabase 数据库</text><text x="480" y="943" class="body">Docker Compose：frontend :3000 · backend :8000</text><text x="1010" y="943" class="body">systemd / health guard / logs</text>
</svg>
