services:
  hermes:
    container_name: insight-hermes
    image: insight-hermes:v2026.8.19
    build:
      context: ../..
      dockerfile: deploy/hermes/Dockerfile
    env_file:
      - /etc/insight-hermes/hermes.env
    environment:
      INSIGHT_PUBLIC_API_URL: "${INSIGHT_PUBLIC_API_URL:-http://host.docker.internal:8000/api}"
      INSIGHT_AGENT_DATA_ROOT: /srv/insight-agent
      HERMES_GATEWAY_SECRET: "${HERMES_GATEWAY_SECRET:?missing HERMES_GATEWAY_SECRET}"
      HERMES_PROVIDER_BASE_URL: "${HERMES_PROVIDER_BASE_URL:?missing HERMES_PROVIDER_BASE_URL}"
      HERMES_PROVIDER_API_KEY: "${HERMES_PROVIDER_API_KEY:?missing HERMES_PROVIDER_API_KEY}"
      HERMES_MAX_ACTIVE: "${HERMES_MAX_ACTIVE:-6}"
      HERMES_IDLE_SECONDS: "${HERMES_IDLE_SECONDS:-1800}"
    working_dir: /srv/insight-agent
    expose:
      - "4096"
    volumes:
      - "${HERMES_DATA_ROOT:-/var/lib/insight-hermes}:/srv/insight-agent"
      - "${HERMES_DATA_ROOT:-/var/lib/insight-hermes}/template:/template:ro"
      - "${HERMES_DATA_ROOT:-/var/lib/insight-hermes}/knowledge:/knowledge/public"
    extra_hosts:
      - "host.docker.internal:${INSIGHT_HOST_GATEWAY:-172.17.0.1}"
    restart: unless-stopped
    read_only: true
    tmpfs:
      - /tmp:size=256m,nosuid,nodev
      - /run:size=16m,nosuid,nodev
    cap_drop: [ALL]
    cap_add: [CHOWN, SETUID, SETGID, DAC_OVERRIDE, FOWNER, FSETID, KILL]
    security_opt:
      - no-new-privileges:true
    cpus: "2.0"
    mem_limit: 4g
    mem_reservation: 768m
    pids_limit: 1024
    healthcheck:
      test:
        - CMD-SHELL
        - node -e "fetch('http://127.0.0.1:4096/healthz').then(r=>{if(!r.ok)process.exit(1)}).catch(()=>process.exit(1))"
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 30s
    networks:
      - hermes-network
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"

  gateway:
    container_name: insight-hermes-gateway
    image: nginxinc/nginx-unprivileged:1.29.4-alpine
    user: "101:101"
    environment:
      NGINX_ENVSUBST_FILTER: "^(INSIGHT_AUTH_VERIFY_URL|INSIGHT_AUTH_CALLBACK_URL|INSIGHT_LOGIN_URL|INSIGHT_APP_ORIGIN|HERMES_GATEWAY_SECRET)$"
      INSIGHT_AUTH_VERIFY_URL: "${INSIGHT_AUTH_VERIFY_URL:-http://host.docker.internal:8000/api/auth/agent/verify}"
      INSIGHT_AUTH_CALLBACK_URL: "${INSIGHT_AUTH_CALLBACK_URL:-http://host.docker.internal:8000/api/auth/agent/callback}"
      INSIGHT_LOGIN_URL: "${INSIGHT_LOGIN_URL:?missing INSIGHT_LOGIN_URL}"
      INSIGHT_APP_ORIGIN: "${INSIGHT_APP_ORIGIN:?missing INSIGHT_APP_ORIGIN}"
      HERMES_GATEWAY_SECRET: "${HERMES_GATEWAY_SECRET:?missing HERMES_GATEWAY_SECRET}"
    extra_hosts:
      - "host.docker.internal:${INSIGHT_HOST_GATEWAY:-172.17.0.1}"
    ports:
      - "${HERMES_BIND_ADDRESS:-0.0.0.0}:${HERMES_PORT:-4096}:8080"
    volumes:
      - ./nginx.conf.template:/etc/nginx/templates/default.conf.template:ro
    depends_on:
      hermes:
        condition: service_healthy
    restart: unless-stopped
    read_only: true
    tmpfs:
      - /tmp:size=16m,nosuid,nodev
      - /var/cache/nginx:size=16m,nosuid,nodev,uid=101,gid=101
      - /var/run:size=1m,nosuid,nodev,uid=101,gid=101
      - /etc/nginx/conf.d:size=1m,nosuid,nodev,uid=101,gid=101
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    cpus: "0.25"
    mem_limit: 128m
    mem_reservation: 32m
    pids_limit: 64
    healthcheck:
      test: ["CMD", "wget", "-q", "-O", "-", "http://127.0.0.1:8080/healthz"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 10s
    networks:
      - hermes-network
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"

networks:
  hermes-network:
    name: insight-hermes-network
