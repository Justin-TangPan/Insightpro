services:
  opencode:
    container_name: insight-opencode
    image: insight-opencode:1.18.23
    build:
      context: .
      dockerfile: Dockerfile
    env_file:
      - /etc/insight-opencode/opencode.env
    environment:
      HOME: /home/opencode
      XDG_CACHE_HOME: /home/opencode/.cache
      XDG_CONFIG_HOME: /home/opencode/.config
      XDG_DATA_HOME: /home/opencode/.local/share
      XDG_STATE_HOME: /home/opencode/.local/state
    command: ["web", "--hostname", "0.0.0.0", "--port", "4096"]
    working_dir: /workspace
    expose:
      - "4096"
    volumes:
      - "${OPENCODE_DATA_ROOT:-/var/lib/insight-opencode}/data:/home/opencode/.local/share/opencode"
      - "${OPENCODE_DATA_ROOT:-/var/lib/insight-opencode}/config:/home/opencode/.config/opencode"
      - "${OPENCODE_DATA_ROOT:-/var/lib/insight-opencode}/cache:/home/opencode/.cache"
      - "${OPENCODE_DATA_ROOT:-/var/lib/insight-opencode}/state:/home/opencode/.local/state/opencode"
      - "${OPENCODE_DATA_ROOT:-/var/lib/insight-opencode}/workspace:/workspace:ro"
      - "./opencode.json:/home/opencode/.config/opencode/opencode.json:ro"
    restart: unless-stopped
    read_only: true
    tmpfs:
      - /tmp:size=256m,nosuid,nodev
      - /run:size=16m,nosuid,nodev
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    cpus: "1.5"
    mem_limit: 2g
    mem_reservation: 512m
    pids_limit: 512
    healthcheck:
      test:
        - CMD-SHELL
        - >-
          node -e "const a=Buffer.from(process.env.OPENCODE_SERVER_USERNAME+':'+process.env.OPENCODE_SERVER_PASSWORD).toString('base64');fetch('http://127.0.0.1:4096/global/health',{headers:{authorization:'Basic '+a}}).then(async r=>{const j=await r.json();if(!r.ok||!j.healthy)process.exit(1)}).catch(()=>process.exit(1))"
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 30s
    networks:
      - opencode-network
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"

  gateway:
    container_name: insight-opencode-gateway
    image: nginxinc/nginx-unprivileged:1.29.4-alpine
    user: "101:101"
    environment:
      NGINX_ENVSUBST_FILTER: "^(INSIGHT_AUTH_VERIFY_URL|INSIGHT_AUTH_CALLBACK_URL|INSIGHT_LOGIN_URL|INSIGHT_APP_ORIGIN|OPENCODE_GATEWAY_SECRET|OPENCODE_BASIC_AUTH)$"
      INSIGHT_AUTH_VERIFY_URL: "${INSIGHT_AUTH_VERIFY_URL:-http://host.docker.internal:8000/api/auth/opencode/verify}"
      INSIGHT_AUTH_CALLBACK_URL: "${INSIGHT_AUTH_CALLBACK_URL:-http://host.docker.internal:8000/api/auth/opencode/callback}"
      INSIGHT_LOGIN_URL: "${INSIGHT_LOGIN_URL:-http://159.138.89.233:3000/auth/login}"
      INSIGHT_APP_ORIGIN: "${INSIGHT_APP_ORIGIN:-http://159.138.89.233:3000}"
      OPENCODE_GATEWAY_SECRET: "${OPENCODE_GATEWAY_SECRET:?missing OPENCODE_GATEWAY_SECRET}"
      OPENCODE_BASIC_AUTH: "${OPENCODE_BASIC_AUTH:?missing OPENCODE_BASIC_AUTH}"
    extra_hosts:
      - "host.docker.internal:${INSIGHT_HOST_GATEWAY:-172.17.0.1}"
    ports:
      - "${OPENCODE_BIND_ADDRESS:-0.0.0.0}:${OPENCODE_PORT:-4096}:8080"
    volumes:
      - ./nginx.conf.template:/etc/nginx/templates/default.conf.template:ro
    depends_on:
      opencode:
        condition: service_healthy
    restart: unless-stopped
    read_only: true
    tmpfs:
      - /tmp:size=16m,nosuid,nodev
      - /var/cache/nginx:size=16m,nosuid,nodev,uid=101,gid=101
      - /var/run:size=1m,nosuid,nodev,uid=101,gid=101
      - /etc/nginx/conf.d:size=1m,nosuid,nodev,uid=101,gid=101
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    cpus: "0.25"
    mem_limit: 128m
    mem_reservation: 32m
    pids_limit: 64
    healthcheck:
      test: ["CMD", "wget", "-q", "-O", "-", "http://127.0.0.1:8080/healthz"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 10s
    networks:
      - opencode-network
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"

networks:
  opencode-network:
    name: insight-opencode-network
